<script>
// A lista de cursos fica no arquivo cursos-lista.js
const lista = document.getElementById("lista");
let grupoAtual = null;
for (const c of CURSOS) {
  if (c.grupo !== grupoAtual) {
    grupoAtual = c.grupo;
    const h = document.createElement("h2");
    h.textContent = c.grupo;
    lista.appendChild(h);
  }
  const card = document.createElement(c.link ? "a" : "div");
  card.className = c.link ? "card" : "card off";
  if (c.link) { card.href = c.link; card.target = "_blank"; card.rel = "noopener"; }
  const b = document.createElement("b"); b.textContent = c.nome;
  const d = document.createElement("span"); d.className = "d"; d.textContent = c.desc;
  const v = document.createElement("span"); v.className = "v"; v.textContent = c.link ? "Abrir no Canva ↗" : "Link em breve";
  card.append(b);
  if (c.desc) card.append(d);
  card.append(v);
  lista.appendChild(card);
}
</script>
