<h1>Cursos da PM</h1>
<p class="sub">Material de estudo dos cursos. Todo curso termina com prova; consulte o item 1 das <a href="/regras-gerais" style="color:var(--acc)">Regras Gerais</a>.</p>
</div></section>
<main>
<div id="lista"></div>
<p class="nota">Dúvidas sobre os cursos: abra um ticket com o QCG.</p>
<script>
// ===== EDITE AQUI =====
// Para cada curso, cole o link do Canva entre as aspas de "link".
// No Canva: Compartilhar → "Link de visualização" (ou "Ver só") → Copiar.
// Deixe "" (vazio) enquanto o curso não tiver link: o card aparece como "Link em breve".
// Para adicionar um curso, copie uma linha { ... }, e cuide da vírgula no final.
const CURSOS = [
  { grupo: "Cursos disponíveis",
    nome: "Tiro Básico", desc: "Manuseio de armamento de baixo e médio calibre", link: "https://canva.link/adrpvuyded4fusj" },
  { grupo: "Cursos disponíveis",
    nome: "Tiro Avançado", desc: "Manuseio de armamento de calibre avançado", link: "https://canva.link/xyih7c6ed70cg9p" },
  { grupo: "Cursos disponíveis",
    nome: "Abordagem e Posicionamento", desc: "Inclui prova prática (simulação de abordagem)", link: "https://canva.link/sf3ig31hk95y6qi" },
  { grupo: "Cursos disponíveis",
    nome: "SAT B", desc: "Curso de direção policial: condução e familiarização com a viatura", link: "https://canva.link/7dm8mfx6d61t4aq" },
];
// ===== FIM =====

const lista = document.getElementById("lista");
let grupoAtual = null;
for (const c of CURSOS) {
  if (c.grupo !== grupoAtual) {
    grupoAtual = c.grupo;
    const h = document.createElement("h2");
    h.textContent = c.grupo;
    lista.appendChild(h);
  }
  const card = document.createElement(c.link ? "a" : "div");
  card.className = c.link ? "card" : "card off";
  if (c.link) { card.href = c.link; card.target = "_blank"; card.rel = "noopener"; }
  const b = document.createElement("b"); b.textContent = c.nome;
  const d = document.createElement("span"); d.className = "d"; d.textContent = c.desc;
  const v = document.createElement("span"); v.className = "v"; v.textContent = c.link ? "Abrir no Canva ↗" : "Link em breve";
  card.append(b);
  if (c.desc) card.append(d);
  card.append(v);
  lista.appendChild(card);
}
</script>
